<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI-Agora replay</title>
<style>
  :root {
    --bg: #fbfbf9; --surface: #ffffff; --ink: #1f1f1d; --ink2: #5f5e58; --line: #e3e2dc;
    --yes: #2a78d6; --no: #b9b7ae; --unk: #efeee9; --dot-idle: #c4c3bb;
    --silos: #eb6834; --central: #2a78d6; --central-smart: #e87ba4; --grassroots: #1baf7a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1a1a19; --ink: #f0efec; --ink2: #a9a8a0; --line: #2f2f2c;
      --yes: #3987e5; --no: #5f5e58; --unk: #262624; --dot-idle: #55544f;
      --silos: #d95926; --central: #3987e5; --central-smart: #d55181; --grassroots: #199e70;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 14px 40px; }
  h1 { font-size: 17px; margin: 0 0 2px; font-weight: 650; }
  .params { color: var(--ink2); font-size: 12.5px; margin-bottom: 14px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 8px; }
  @media (max-width: 420px) { .tab { font-size: 13px; padding: 8px 2px; gap: 4px; } }
  .tab { flex: 1; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
         border-radius: 8px; padding: 8px 4px; font: inherit; cursor: pointer;
         display: flex; align-items: center; justify-content: center; gap: 6px; }
  .tab .sw { width: 10px; height: 10px; border-radius: 50%; }
  .tab[aria-selected="true"] { border-color: var(--ink); font-weight: 600; }
  .desc { color: var(--ink2); font-size: 13px; min-height: 19px; margin-bottom: 10px; }
  .controls { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .controls button { width: 38px; height: 34px; border-radius: 8px; border: 1px solid var(--line);
                     background: var(--surface); color: var(--ink); font-size: 15px; cursor: pointer; }
  .controls input[type=range] { flex: 1; accent-color: var(--ink); }
  .round { font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 12.5px;
           width: 92px; text-align: right; }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 18px; }
  .tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .tile .k { font-size: 11.5px; color: var(--ink2); }
  .tile .v { font-size: 20px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .v small { font-size: 12px; font-weight: 500; color: var(--ink2); }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--ink2);
       text-transform: uppercase; letter-spacing: .04em; }
  #groups { position: relative; margin-bottom: 22px; }
  .box { position: absolute; border: 1px solid var(--line); border-radius: 8px; background: var(--surface);
         transition: border-color .3s; }
  .box.formed { border-color: var(--yes); }
  .box .lbl { position: absolute; left: 7px; right: 7px; top: 4px; font-size: 11px; color: var(--ink2);
              white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .box.formed .lbl { color: var(--ink); }
  .pool-lbl { position: absolute; left: 0; top: 0; font-size: 11px; color: var(--ink2); }
  .dot { position: absolute; left: 0; top: 0; width: 10px; height: 10px; border-radius: 50%;
         background: var(--dot-idle); transition: transform .45s ease, background-color .3s; }
  .dot.in { background: var(--yes); }
  .dot.asked { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--ink); }
  #matrix { display: grid; gap: 1px; margin-bottom: 8px; }
  #matrix .c { border-radius: 1.5px; background: var(--unk); }
  #matrix .c.y { background: var(--yes); }
  #matrix .c.n { background: var(--no); }
  #matrix .c.a { outline: 1.5px solid var(--ink); outline-offset: -1px; }
  #matrix .h { font-size: 10px; color: var(--ink2); text-align: center; line-height: 14px; }
  .legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--ink2); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px;
                         margin-right: 5px; vertical-align: -1px; background: var(--c); }
  .legend .askd::before { background: transparent; outline: 1.5px solid var(--ink); outline-offset: -1.5px; }
  .hint { color: var(--ink2); font-size: 11.5px; margin-top: 18px; }
</style>
</head>
<body>
<main>
  <h1>AI-Agora replay</h1>
  <div class="params" id="params"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="desc" id="desc"></div>
  <div class="controls">
    <button id="play" aria-label="play">▶</button>
    <input type="range" id="scrub" min="0" max="0" value="0" aria-label="round">
    <div class="round" id="round"></div>
  </div>
  <div class="tiles">
    <div class="tile"><div class="k">Questions</div><div class="v" id="t-att"></div></div>
    <div class="tile"><div class="k">Messages</div><div class="v" id="t-msg"></div></div>
    <div class="tile"><div class="k">In groups</div><div class="v" id="t-srv"></div></div>
  </div>
  <h2>Groups</h2>
  <div id="groups"></div>
  <h2>What the agents know</h2>
  <div id="matrix"></div>
  <div class="legend">
    <span style="--c: var(--yes)">accepts</span>
    <span style="--c: var(--no)">does not accept</span>
    <span style="--c: var(--unk)">unknown</span>
    <span class="askd">asked this round</span>
  </div>
  <div class="hint">Rows are residents; columns are initiatives, numbered as in the groups.<br>Space plays or pauses; ← → step through rounds.</div>
</main>

const SETTINGS = {
  silos: ["Silos", "Each agent asks its resident alone, then sends one report; a mechanism forms the groups."],
  central: ["Central", "Agents talk only to a coordinator, which decides whom to ask about what."],
  "central-smart": ["Central+", "A smarter coordinator: samples every initiative first, then asks greedily, in smaller batches."],
  grassroots: ["Grassroots", "No coordinator: agents broadcast what they learn, and each runs the same plan."],
};
const $ = id => document.getElementById(id);
let cur = null, frame = 0, timer = null, dots = [], boxes = [], cells = [], layout = null;

function init(data) {
  const p = data.params;
  const know = p.informed ? `agents start knowing ${Math.round(p.informed * 100)}%` : "agents start knowing nothing";
  $("params").textContent = `${data.n} residents · ${data.m} initiatives · groups of at least ${data.min_size} · ` +
    `${p.budget} questions per resident at most · ${know}`;
  const tabs = $("tabs");
  for (const s of Object.keys(SETTINGS)) {
    if (!data.runs[s]) continue;
    const b = document.createElement("button");
    b.className = "tab"; b.setAttribute("role", "tab"); b.dataset.s = s;
    b.innerHTML = `<span class="sw" style="background:var(--${s})"></span>${SETTINGS[s][0]}`;
    b.onclick = () => select(s);
    tabs.appendChild(b);
  }
  // dots, boxes, matrix
  const g = $("groups");
  const pool = document.createElement("div"); pool.className = "pool-lbl"; pool.textContent = "not in a group yet";
  g.appendChild(pool);
  for (let j = 0; j < data.m; j++) {
    const b = document.createElement("div"); b.className = "box";
    b.innerHTML = `<div class="lbl"></div>`; g.appendChild(b); boxes.push(b);
  }
  for (let i = 0; i < data.n; i++) {
    const d = document.createElement("div"); d.className = "dot";
    const acc = data.names.initiatives.filter((_, j) => data.accept[i][j]);
    d.title = `${data.names.members[i]} — accepts: ${acc.join(", ") || "nothing"}`;
    g.appendChild(d); dots.push(d);
  }
  const mx = $("matrix");
  mx.appendChild(document.createElement("div"));
  for (let j = 0; j < data.m; j++) {
    const h = document.createElement("div"); h.className = "h"; h.textContent = j + 1;
    h.title = data.names.initiatives[j]; mx.appendChild(h);
  }
  for (let i = 0; i < data.n; i++) {
    const rh = document.createElement("div"); mx.appendChild(rh);
    cells.push([]);
    for (let j = 0; j < data.m; j++) {
      const c = document.createElement("div"); c.className = "c";
      c.title = `${data.names.members[i]} · ${data.names.initiatives[j]}`;
      mx.appendChild(c); cells[i].push(c);
    }

  $("scrub").oninput = e => { stop(); frame = +e.target.value; render(); };

    if (e.key === " ") { e.preventDefault(); toggle(); }

    else if (e.key === "ArrowLeft") { stop(); step(-1); }
  });

}

function select(s) {
  stop(); cur = s; frame = 0;
  for (const b of $("tabs").children) b.setAttribute("aria-selected", b.dataset.s === s);
  $("desc").textContent = SETTINGS[s][1];
  $("scrub").max = DATA.runs[s].frames.length - 1;
  computeLayout(); render();
}

function computeLayout() {
  const W = $("groups").clientWidth, n = DATA.n, m = DATA.m;
  const cols = W < 520 ? 3 : 4, gap = 8, step = 13;
  const boxW = (W - gap * (cols - 1)) / cols;
  const perRow = Math.max(1, Math.floor((boxW - 12) / step));
  let maxG = 1;
  for (const f of DATA.runs[cur].frames) for (const g of Object.values(f.groups)) maxG = Math.max(maxG, g.length);
  const boxH = 22 + Math.ceil(maxG / perRow) * step + 6;
  const perRowU = Math.max(1, Math.floor(W / step));
  const poolH = 18 + Math.ceil(n / perRowU) * step + 10;
  layout = { W, cols, gap, step, boxW, boxH, perRow, perRowU, poolH };
  for (let j = 0; j < m; j++) {
    const x = (j % cols) * (boxW + gap), y = poolH + Math.floor(j / cols) * (boxH + gap);
    Object.assign(boxes[j].style, { left: x + "px", top: y + "px", width: boxW + "px", height: boxH + "px" });
  }
  $("groups").style.height = poolH + Math.ceil(m / cols) * (boxH + gap) + "px";
  const cw = Math.min(22, Math.floor((W - 20) / m) - 1);
  $("matrix").style.gridTemplateColumns = `14px repeat(${m}, ${cw}px)`;
  $("matrix").style.gridAutoRows = "8px";
  $("matrix").firstChild.style.height = "14px";
}

function render() {
  const run = DATA.runs[cur], f = run.frames[frame], L = layout, last = run.frames.length - 1;
  $("scrub").value = frame;
  $("round").textContent = frame === last ? `round ${frame + 1}/${last + 1} · end` : `round ${frame + 1}/${last + 1}`;
  $("t-att").textContent = f.attention;
  $("t-msg").textContent = f.messages.toLocaleString();
  $("t-srv").innerHTML = `${f.served} <small>/ ${DATA.optimum} best</small>`;
  const where = new Array(DATA.n).fill(null);
  for (const [j, g] of Object.entries(f.groups)) g.forEach((i, k) => where[i] = [+j, k]);

  for (let i = 0; i < DATA.n; i++) {
    let x, y;
    if (where[i]) {
      const [j, k] = where[i];
      x = (j % L.cols) * (L.boxW + L.gap) + 6 + (k % L.perRow) * L.step;
      y = L.poolH + Math.floor(j / L.cols) * (L.boxH + L.gap) + 22 + Math.floor(k / L.perRow) * L.step;
    } else {
      x = (u % L.perRowU) * L.step; y = 18 + Math.floor(u / L.perRowU) * L.step; u++;
    }
    dots[i].style.transform = `translate(${x}px, ${y}px)`;
    dots[i].classList.toggle("in", !!where[i]);
    dots[i].classList.toggle("asked", askedNow.has(i));
  }
  for (let j = 0; j < DATA.m; j++) {
    const g = f.groups[j] || [];
    boxes[j].classList.toggle("formed", g.length > 0);
    boxes[j].firstChild.textContent = `${j + 1} · ${DATA.names.initiatives[j]}`;
  }
  const askedSet = new Set(f.asked.map(([i, j]) => i * 1000 + j));
  for (let i = 0; i < DATA.n; i++) for (let j = 0; j < DATA.m; j++) {
    const v = f.known[i][j], c = cells[i][j];
    c.className = "c" + (v === 1 ? " y" : v === 0 ? " n" : "") + (askedSet.has(i * 1000 + j) ? " a" : "");
  }
}

function step(d) {
  const last = DATA.runs[cur].frames.length - 1;
  frame = Math.max(0, Math.min(last, frame + d)); render();

function toggle() {
  if (timer) return stop();
  const last = DATA.runs[cur].frames.length - 1;
  if (frame >= last) frame = 0;
  $("play").textContent = "❚❚";
  render();
  timer = setInterval(() => { if (frame >= last) return stop(); step(1); }, 650);
}

if (DATA) init(DATA);
else fetch(new URLSearchParams(location.search).get("run") || "replay.json")
  .then(r => r.json()).then(d => { DATA = d; init(d); });
</script>
